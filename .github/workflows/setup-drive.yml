
name: ClipVault - Setup Google Drive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-drive:
    name: Create ClipVault Drive folder
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API dependencies
        run: |
          python -m pip install \
            "google-api-python-client>=2.150.0,<3.0.0" \
            "google-auth>=2.35.0,<3.0.0" \
            "google-auth-httplib2>=0.2.0,<1.0.0"

      - name: Create Google Drive folder
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          required = [
              "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET",
              "GOOGLE_REFRESH_TOKEN",
          ]

          missing = [
              name for name in required
              if not os.environ.get(name)
          ]

          if missing:
              print(
                  "::error::Missing secrets: " + ", ".join(missing)
              )
              sys.exit(1)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["GOOGLE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["GOOGLE_CLIENT_ID"],
              client_secret=os.environ["GOOGLE_CLIENT_SECRET"],
              scopes=[
                  "https://www.googleapis.com/auth/drive.file"
              ],
          )

          credentials.refresh(Request())

          service = build(
              "drive",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          # Search only folders visible to this OAuth app.
          response = service.files().list(
              q=(
                  "name = 'ClipVault' "
                  "and mimeType = "
                  "'application/vnd.google-apps.folder' "
                  "and trashed = false"
              ),
              spaces="drive",
              fields="files(id,name),nextPageToken",
              page_size=100,
          ).execute()

          folders = response.get("files", [])

          if folders:
              folder = folders[0]
              print("Existing app-accessible folder found.")
          else:
              folder = service.files().create(
                  body={
                      "name": "ClipVault",
                      "mimeType":
                          "application/vnd.google-apps.folder",
                  },
                  fields="id,name,webViewLink",
              ).execute()

              print("New ClipVault folder created.")

          folder_id = folder["id"]

          print("")
          print("===================================")
          print("CLIPVAULT GOOGLE DRIVE SETUP")
          print("===================================")
          print("Folder name:", folder["name"])
          print("Folder ID:", folder_id)
          print(
              "Folder URL:",
              "https://drive.google.com/drive/folders/"
              + folder_id
          )
          print("===================================")

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("## ClipVault Google Drive\n\n")
              summary.write(
                  f"Folder ID: `{folder_id}`\n\n"
              )
              summary.write(
                  f"[Open folder in Google Drive]"
                  f"(https://drive.google.com/drive/folders/"
                  f"{folder_id})\n"
              )
          PY
