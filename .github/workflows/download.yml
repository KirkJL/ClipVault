
name: ClipVault - Download to Google Drive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Download mode
        required: true
        type: choice
        default: single
        options:
          - single
          - batch
      video_url:
        description: YouTube video URL
        required: false
        type: string
      manifest:
        description: Batch manifest file
        required: false
        default: halo-60.json
        type: string
      quality:
        description: Maximum resolution
        required: true
        type: choice
        default: "1080"
        options:
          - "720"
          - "1080"
          - "1440"
          - "2160"

permissions:
  contents: read

concurrency:
  group: clipvault-drive-upload
  cancel-in-progress: false

jobs:
  download:
    name: Download and upload videos
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      DOWNLOAD_MODE: ${{ inputs.mode }}
      VIDEO_URL: ${{ inputs.video_url }}
      MANIFEST_PATH: ${{ inputs.manifest }}
      VIDEO_QUALITY: ${{ inputs.quality }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      CLIPVAULT_POT_PROVIDER_URL: http://127.0.0.1:4416

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify JavaScript runtime
        run: deno --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify yt-dlp
        run: |
          python -m yt_dlp --version
          python -m pip show bgutil-ytdlp-pot-provider

      - name: Start PO-token provider
        run: |
          docker run \
            --name clipvault-bgutil \
            --detach \
            --init \
            --publish 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno

      - name: Verify PO-token provider
        shell: bash
        run: |
          echo "Waiting for BgUtils provider..."

          for attempt in {1..30}; do
            if ! docker inspect \
              --format '{{.State.Running}}' \
              clipvault-bgutil 2>/dev/null \
              | grep -qx true; then
              echo "::error::Provider container stopped."
              docker logs clipvault-bgutil
              exit 1
            fi

            # HTTP 400 from the root endpoint is acceptable
            # for reachability. It does not prove token generation.
            STATUS=$(curl -sS -o /dev/null \
              --max-time 2 \
              -w '%{http_code}' \
              http://127.0.0.1:4416 || true)

            if [[ "$STATUS" =~ ^[1-5][0-9][0-9]$ ]]; then
              echo "Provider reachable (HTTP $STATUS)"
              break
            fi

            if [[ "$attempt" == "30" ]]; then
              echo "::error::Provider unreachable."
              exit 1
            fi

            sleep 2
          done

      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$GOOGLE_CLIENT_ID" ||
                -z "$GOOGLE_CLIENT_SECRET" ||
                -z "$GOOGLE_REFRESH_TOKEN" ||
                -z "$GOOGLE_DRIVE_FOLDER_ID" ]]; then
            echo "::error::Missing Google OAuth secrets."
            exit 1
          fi

          if [[ "$DOWNLOAD_MODE" == "single" &&
                -z "$VIDEO_URL" ]]; then
            echo "::error::Single mode requires a URL."
            exit 1
          fi

          if [[ "$DOWNLOAD_MODE" == "batch" &&
                ! -f "$MANIFEST_PATH" ]]; then
            echo "::error::Batch manifest not found."
            exit 1
          fi

          if [[ "$DOWNLOAD_MODE" != "single" &&
                "$DOWNLOAD_MODE" != "batch" ]]; then
            echo "::error::Invalid download mode."
            exit 1
          fi

      # NEW: Reconstruct the Netscape cookie file.
      # Secret content never appears in command arguments
      # or in the workflow logs.
      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          raw = os.environ.get("YOUTUBE_COOKIES_SECRET", "")

          if not raw.strip():
              raise RuntimeError(
                  "YOUTUBE_COOKIES GitHub secret is missing or empty"
              )

          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          raw = raw.lstrip("\ufeff")

          lines = raw.splitlines()

          # Validate format without displaying secrets.
          records = []
          for line in lines:
              if not line or line.startswith("#"):
                  if not line.startswith("#HttpOnly_"):
                      continue
              parts = line.split("\t")
              if len(parts) == 7:
                  records.append(parts)

          youtube_records = [
              r for r in records
              if r[0].removeprefix("#HttpOnly_").lstrip(".")
              in ("youtube.com", "www.youtube.com")
          ]

          if not youtube_records:
              raise RuntimeError(
                  "Cookie export has no YouTube cookie records. "
                  "Re-export from youtube.com in Firefox."
              )

          auth_names = {
              "SID", "HSID", "SSID", "APISID", "SAPISID",
              "__Secure-1PSID", "__Secure-3PSID",
              "__Secure-1PAPISID", "__Secure-3PAPISID"
          }

          found_auth = any(
              r[5] in auth_names
              for r in youtube_records
          )

          if not found_auth:
              raise RuntimeError(
                  "YouTube cookies exist, but no recognised "
                  "authentication cookies were found. "
                  "Check that Firefox was signed into YouTube."
              )

          fd, path = tempfile.mkstemp(
              prefix="clipvault-youtube-",
              suffix=".txt"
          )

          try:
              with os.fdopen(fd, "w", encoding="utf-8") as f:
                  if not raw.startswith(
                      ("# Netscape HTTP Cookie File",
                       "# HTTP Cookie File")
                  ):
                      f.write("# Netscape HTTP Cookie File\n")
                  f.write(raw)
                  if not raw.endswith("\n"):
                      f.write("\n")

              os.chmod(path, 0o600)

              with open(
                  os.environ["GITHUB_ENV"],
                  "a",
                  encoding="utf-8"
              ) as env:
                  env.write(f"YOUTUBE_COOKIE_FILE={path}\n")

              # Save only the temporary path for cleanup.
              with open(
                  os.environ["RUNNER_TEMP"]
                  + "/clipvault-cookie-path",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(path)

              print("YouTube cookie file created.")
              print("YouTube authentication cookies detected.")
              print("Cookie values were not logged.")

          except Exception:
              Path(path).unlink(missing_ok=True)
              raise
          PY

      - name: Download and upload
        run: |
          python downloader.py

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Diagnose PO-token provider
        if: failure()
        run: |
          docker logs --tail 50 clipvault-bgutil || true

      - name: Cleanup
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/clipvault-cookie-path" ]]; then
            COOKIE_PATH=$(cat "$RUNNER_TEMP/clipvault-cookie-path")
            rm -f -- "$COOKIE_PATH"
            rm -f -- "$RUNNER_TEMP/clipvault-cookie-path"
          fi

          docker rm -f clipvault-bgutil || true
          rm -rf downloads/
