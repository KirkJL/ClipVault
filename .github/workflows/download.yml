
name: ClipVault Download

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Download mode
        required: true
        default: single
        type: choice
        options:
          - single
          - batch

      video_url:
        description: YouTube video URL
        required: false
        default: ""
        type: string

      quality:
        description: Maximum video quality
        required: true
        default: "1080"
        type: choice
        options:
          - "720"
          - "1080"
          - "1440"
          - "2160"

      manifest:
        description: Batch manifest filename
        required: false
        default: halo-60.json
        type: string

permissions:
  contents: read

concurrency:
  group: clipvault-download
  cancel-in-progress: false

jobs:
  download:
    name: Download and upload to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DOWNLOAD_MODE: ${{ inputs.mode }}
      VIDEO_URL: ${{ inputs.video_url }}
      VIDEO_QUALITY: ${{ inputs.quality }}
      MANIFEST_PATH: ${{ inputs.manifest }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      CLIPVAULT_POT_PROVIDER_URL: http://127.0.0.1:4416

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start BgUtils PO-token provider
        run: |
          docker run -d \
            --name clipvault-pot-provider \
            --restart no \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno

      
      - name: Wait for PO-token provider
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import urllib.error

          url = "http://127.0.0.1:4416"

          for attempt in range(30):
              try:
                  urllib.request.urlopen(
                      url,
                      timeout=3
                  )

                  print(
                      "PO-token provider is responding"
                  )
                  break

              except urllib.error.HTTPError as error:
                  # The root URL may return HTTP 400
                  # because it is not a valid API request.
                  # An HTTP response still confirms that
                  # the server is reachable.
                  print(
                      "PO-token provider reachable "
                      f"(HTTP {error.code})"
                  )
                  break

              except (
                  urllib.error.URLError,
                  TimeoutError
              ):
                  if attempt == 29:
                      raise RuntimeError(
                          "PO-token provider did not start"
                      )

                  time.sleep(2)
          PY

        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:4416"

          for attempt in range(30):
              try:
                  urllib.request.urlopen(
                      url,
                      timeout=3
                  )
                  print("Provider is responding")
                  break
              except Exception:
                  if attempt == 29:
                      raise RuntimeError(
                          "PO-token provider did not start"
                      )
                  time.sleep(2)
          PY

      # The secret contains the original Netscape cookies.txt.
      # No Base64 conversion is required.
      #
      # Keep the secret out of shell command arguments
      # and never print its contents.

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          cookies = os.environ.get(
              "YOUTUBE_COOKIES_SECRET", ""
          )

          if not cookies.strip():
              print(
                  "No YouTube cookie secret configured. "
                  "Continuing without cookies."
              )
          else:
              cookie_path = (
                  Path(tempfile.gettempdir())
                  / "clipvault-youtube-cookies.txt"
              )

              # Preserve Netscape cookie formatting.
              cookies = cookies.replace(
                  "\r\n", "\n"
              ).replace("\r", "\n")

              cookie_path.write_text(
                  cookies,
                  encoding="utf-8"
              )

              cookie_path.chmod(0o600)

              with open(
                  os.environ["GITHUB_ENV"],
                  "a",
                  encoding="utf-8"
              ) as env_file:
                  env_file.write(
                      f"YOUTUBE_COOKIE_FILE={cookie_path}\n"
                  )

              print(
                  "YouTube cookie file prepared securely."
              )
          PY

      - name: Download and upload videos
        run: |
          python downloader.py

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up authentication files
        if: always()
        run: |
          if [ -n "${YOUTUBE_COOKIE_FILE:-}" ]; then
            rm -f -- "$YOUTUBE_COOKIE_FILE"
          fi

          docker rm -f \
            clipvault-pot-provider \
            2>/dev/null || true
