
name: ClipVault Download

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Download mode
        required: true
        default: single
        type: choice
        options:
          - single
          - batch

      video_url:
        description: YouTube video URL
        required: false
        default: ""
        type: string

      quality:
        description: Maximum video quality
        required: true
        default: "1080"
        type: choice
        options:
          - "720"
          - "1080"
          - "1440"
          - "2160"

      manifest:
        description: Batch manifest filename
        required: false
        default: halo-60.json
        type: string

permissions:
  contents: read

concurrency:
  group: clipvault-download
  cancel-in-progress: false

jobs:
  download:
    name: Download and upload to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DOWNLOAD_MODE: ${{ inputs.mode }}
      VIDEO_URL: ${{ inputs.video_url }}
      VIDEO_QUALITY: ${{ inputs.quality }}
      MANIFEST_PATH: ${{ inputs.manifest }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

      CLIPVAULT_POT_PROVIDER_URL: http://127.0.0.1:4416

    steps:
      # ============================================
      # Repository and runtime
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ============================================
      # BgUtils PO-token provider
      # ============================================

      - name: Start BgUtils PO-token provider
        run: |
          docker run -d \
            --name clipvault-pot-provider \
            --restart no \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno

      - name: Wait for PO-token provider
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import urllib.error

          url = "http://127.0.0.1:4416"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      url,
                      timeout=3
                  ) as response:
                      print(
                          "PO-token provider responding "
                          f"(HTTP {response.status})"
                      )
                  break

              except urllib.error.HTTPError as error:
                  # The root URL is not necessarily
                  # a valid provider API endpoint.
                  #
                  # HTTP 400 still confirms that the
                  # server is reachable.
                  #
                  # This is a reachability check,
                  # not proof of valid token generation.

                  print(
                      "PO-token provider reachable "
                      f"(HTTP {error.code})"
                  )
                  break

              except (
                  urllib.error.URLError,
                  TimeoutError
              ) as error:
                  if attempt == 29:
                      raise RuntimeError(
                          "PO-token provider did not start"
                      ) from error

                  print(
                      "Waiting for PO-token provider "
                      f"({attempt + 1}/30)"
                  )

                  time.sleep(2)
          PY

      # ============================================
      # YouTube browser cookies
      # ============================================

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_SECRET: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path

          cookies = os.environ.get(
              "YOUTUBE_COOKIES_SECRET", ""
          )

          if not cookies.strip():
              print(
                  "No YouTube cookie secret configured. "
                  "Continuing without cookies."
              )

          else:
              cookie_path = (
                  Path(tempfile.gettempdir())
                  / "clipvault-youtube-cookies.txt"
              )

              # Preserve the Netscape cookie format.
              # Do not log or print cookie contents.

              cookies = cookies.replace(
                  "\r\n", "\n"
              ).replace("\r", "\n")

              # Use restrictive permissions from
              # the moment the file is created.

              fd = os.open(
                  str(cookie_path),
                  os.O_WRONLY
                  | os.O_CREAT
                  | os.O_TRUNC,
                  0o600
              )

              with os.fdopen(
                  fd,
                  "w",
                  encoding="utf-8"
              ) as handle:
                  handle.write(cookies)

              cookie_path.chmod(0o600)

              # Make the path available to
              # subsequent workflow steps.

              with open(
                  os.environ["GITHUB_ENV"],
                  "a",
                  encoding="utf-8"
              ) as env_file:
                  env_file.write(
                      f"YOUTUBE_COOKIE_FILE={cookie_path}\n"
                  )

              print(
                  "YouTube cookie file prepared securely."
              )
          PY

      # ============================================
      # Download and Google Drive upload
      # ============================================

      - name: Download and upload videos
        run: |
          python downloader.py

      # ============================================
      # Execution report
      # ============================================

      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

      # ============================================
      # Cleanup
      # ============================================

      - name: Clean up authentication files
        if: always()
        run: |
          if [ -n "${YOUTUBE_COOKIE_FILE:-}" ]; then
            rm -f -- "$YOUTUBE_COOKIE_FILE"
          fi

          docker rm -f \
            clipvault-pot-provider \
            2>/dev/null || true
