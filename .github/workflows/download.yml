
name: ClipVault - Download to Google Drive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Download mode"
        required: true
        type: choice
        default: single
        options:
          - single
          - batch

      video_url:
        description: "YouTube video URL"
        required: false
        type: string

      manifest:
        description: "Manifest file path (batch mode)"
        required: false
        default: "halo-60.json"
        type: string

      quality:
        description: "Maximum video resolution"
        required: true
        type: choice
        default: "1080"
        options:
          - "720"
          - "1080"
          - "1440"
          - "2160"

jobs:
  download:
    name: Download and upload videos
    runs-on: ubuntu-latest

    timeout-minutes: 120

    permissions:
      contents: read

    concurrency:
      group: clipvault-drive-upload
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"

      DOWNLOAD_MODE: ${{ inputs.mode }}
      VIDEO_URL: ${{ inputs.video_url }}
      MANIFEST_PATH: ${{ inputs.manifest }}
      VIDEO_QUALITY: ${{ inputs.quality }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}

    steps:
      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Install Deno for yt-dlp
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 5. Verify JavaScript runtime
      - name: Verify JavaScript runtime
        run: |
          deno --version

      # 6. Install yt-dlp, BgUtils plugin and Google APIs
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 7. Verify yt-dlp and plugin discovery
      - name: Verify yt-dlp
        run: |
          python -m yt_dlp --version
          python -m yt_dlp --verbose --list-extractors \
            > /tmp/clipvault-extractors.txt 2>&1

          if grep -q "bgutil" /tmp/clipvault-extractors.txt; then
            echo "BgUtils plugin detected."
          else
            echo "Checking plugin through Python..."
            python -m pip show bgutil-ytdlp-pot-provider
          fi

      # 8. Start the local BgUtils token generator
      - name: Start PO-token provider
        shell: bash
        run: |
          docker run \
            --name clipvault-bgutil \
            --detach \
            --init \
            --publish 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:2.0.2-deno

      # 9. Wait for the token provider
      - name: Verify PO-token provider
        shell: bash
        run: |
          echo "Waiting for BgUtils provider..."

          READY=0

          for attempt in {1..30}; do
            if ! docker inspect \
              --format '{{.State.Running}}' \
              clipvault-bgutil 2>/dev/null \
              | grep -qx true; then
              echo "Provider container stopped."
              docker logs clipvault-bgutil
              exit 1
            fi

            if curl \
              --silent \
              --output /dev/null \
              --max-time 2 \
              http://127.0.0.1:4416; then
              READY=1
              break
            fi

            sleep 2
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::BgUtils provider did not respond."
            docker logs clipvault-bgutil
            exit 1
          fi

          echo "BgUtils provider is responding."

      # 10. Validate Google Drive configuration
      - name: Validate configuration
        shell: bash
        run: |
          if [[ -z "$GOOGLE_CLIENT_ID" ||
                -z "$GOOGLE_CLIENT_SECRET" ||
                -z "$GOOGLE_REFRESH_TOKEN" ||
                -z "$GOOGLE_DRIVE_FOLDER_ID" ]]; then
            echo "::error::Missing Google OAuth secrets."
            exit 1
          fi

          if [[ "$DOWNLOAD_MODE" == "single" &&
                -z "$VIDEO_URL" ]]; then
            echo "::error::Single mode requires a video URL."
            exit 1
          fi

          if [[ "$DOWNLOAD_MODE" == "batch" &&
                ! -f "$MANIFEST_PATH" ]]; then
            echo "::error::Manifest file not found."
            exit 1
          fi

          if [[ "$DOWNLOAD_MODE" != "single" &&
                "$DOWNLOAD_MODE" != "batch" ]]; then
            echo "::error::Invalid download mode."
            exit 1
          fi

      # 11. Download and upload to Google Drive
      - name: Download and upload
        run: |
          python downloader.py

      # 12. Save execution reports
      - name: Upload execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipvault-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

      # 13. Show provider logs on failure
      - name: Diagnose PO-token provider
        if: failure()
        run: |
          docker logs --tail 100 clipvault-bgutil || true

      # 14. Stop provider and remove temporary files
      - name: Cleanup
        if: always()
        run: |
          docker rm -f clipvault-bgutil || true
          rm -rf downloads/
